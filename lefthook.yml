# Hooks de git (context.md, sección 2.1). Se instalan solos con `pnpm install` (script prepare).
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    biome:
      glob: "*.{js,cjs,mjs,ts,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
